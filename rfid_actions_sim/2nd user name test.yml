http:
  method: GET
  url: 127.0.0.1:8000/Locky/default/get_nome_colaborador?nome=Paul Walker&grupo=b
  params:
    - name: nome
      value: Paul Walker
      type: query
    - name: grupo
      value: b
      type: query
