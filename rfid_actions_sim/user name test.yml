info:
  name: user name test
  type: http
  seq: 1

http:
  method: GET
  url: 127.0.0.1:8000/Locky/default/get_nome_colaborador?nome=Joe Schmoe&grupo=a
  params:
    - name: nome
      value: Joe Schmoe
      type: query
    - name: grupo
      value: a
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
