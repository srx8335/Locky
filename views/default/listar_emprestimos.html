{{block page_js}}
<!-- Open the popup when the delete action is clicked. -->
<!-- Abre o popup quando a ação de apagar é clicada. -->

<script>
  let deleteUrl = ""; // Variable used to store the URL.
  // Variável usada para armazenar o URL.

  $(document).ready(function(){ //Esperar que o docuemnto esteja pronto
    // Quando clicas em "Excluir"
    $(".apagar_emp").click(function(e){ 
      e.preventDefault(); // Prevent the link's default behavior.
      // Impede o comportamento predefinido do link.
      deleteUrl = $(this).attr('href'); // Store the URL for the later redirect.
      // Guarda o URL para o redirecionamento posterior.
      $("#popupConfirm")
        .fadeIn(400) //Mostra o popup
        .css("display", "flex");
        
    });

    $("#cancelDelete").click(function(){  //ao Clicar em cancelar
      console.log("Cancelamento do popup acionado");
      $("#popupConfirm").fadeOut(200); //Esconde o popup
      deleteUrl = ""; //Limpa a variavel do URL 
    });

    $("#confirmDelete").click(function(){ //ao clicar em confirmar
      if (deleteUrl) { // Check whether the URL variable has a value.
        // Verifica se a variável do URL tem um valor.
        window.location.href = deleteUrl; // Redirect to the URL.
        // Redireciona para o URL.
      }
    });
  });
</script>



<script>
$(document).ready(function(){
    let ids = []; // Array of IDs to send to the server.
    // Array de IDs para enviar ao servidor.

    // Bulk flow.
    // Fluxo múltiplo.
    $("#btnDevolverSelecionados").click(function(e){
        e.preventDefault();
        ids = [];
        $("input[name='selecionados']:checked").each(function(){
            ids.push($(this).val());
        });
        if(ids.length === 0){
            alert("⚠️ Nenhum empréstimo selecionado!");
            return;
        }
        $("#nomeDevolucao").val('');
        $("#popupDev").fadeIn(400).css("display","flex");
    });

    // Fluxo individual
    $(".devolver_emprestimo").click(function(e){
        e.preventDefault();
        ids = [$(this).data("id")]; // sempre em array
        $("#nomeDevolucao").val('');
        $("#popupDev").fadeIn(400).css("display","flex");
    });

    // Cancelar
    $("#cancelDev").click(function(){
        $("#popupDev").fadeOut(200);
        ids = [];
    });

    // Confirmar
    $("#confirmDev").click(function(){
        let nome = $("#nomeDevolucao").val().trim();
        if(!nome){
            alert("⚠️ Por favor, introduza o nome ou passe o cartão!");
            return;
        }

        if(ids.length === 0){
            alert("⚠️ Nenhum empréstimo selecionado!");
            return;
        }

        // AJAX call for one or multiple items.
        // Chamada AJAX para um ou vários itens.
        $.post("{{=URL('default', 'devolver_selecionados')}}", {
            'ids[]': ids,
            nome: nome
        }, function(res){
            location.reload();
        });
    });
});
</script>
