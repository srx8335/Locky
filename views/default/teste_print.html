<h2 id="resultado">À espera de cartão...</h2>


{{block page_js}}
<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<script>
  var pusher = new Pusher('{{=locky_pusher_key}}', {
    cluster: '{{=locky_pusher_cluster}}'
  });

  var canal = pusher.subscribe('chaveiro');
  canal.bind('geral', function(data) {
    console.log("Recebido do pusher:", data);
    document.getElementById("resultado").textContent = "Utilizador: " + data.nome;
  });
</script>
{{end}}
